model:
  name_or_path: "microsoft/deberta-v3-large"
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 512

training:
  batch_size: 4             # Optimized for dual 16GB T4 GPUs
  gradient_accumulation_steps: 8
  learning_rate: 1e-5
  weight_decay: 0.01
  num_train_epochs: 3
  warmup_ratio: 0.1
  seed: 42
  fp16: true                # Crucial for GPU speedup

data:
  train_path: "/kaggle/working/sage/data/processed/train_10k.parquet"
  test_path: "/kaggle/working/sage/data/processed/test_1k.parquet"
