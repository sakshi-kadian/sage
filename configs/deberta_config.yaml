model:
  name_or_path: "microsoft/deberta-v3-large"
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  max_position_embeddings: 512

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 1e-5
  weight_decay: 0.01
  num_train_epochs: 3
  warmup_ratio: 0.1
  seed: 42
  fp16: true
